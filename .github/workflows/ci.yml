name: CI

# Gitybara ships for Windows x64 only for now, so that is all this checks.
# Releases are built by release.yml.
on:
  push:
    branches:
      - development
  pull_request:

env:
  NODE_VERSION: 24.19.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - run: yarn
      - run: yarn validate-electron-version
      - run: yarn lint
      - run: yarn validate-changelog
      - name: Ensure a clean working directory
        run: git diff --name-status --exit-code
  build:
    name: Windows x64
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-ci-environment
        with:
          node-version: ${{ env.NODE_VERSION }}
          arch: x64
      - name: Run desktop-trampoline tests
        run: |
          cd vendor/desktop-trampoline
          yarn install
          yarn test
      - name: Build production app
        run: yarn build:prod
        env:
          npm_config_arch: x64
          TARGET_ARCH: x64
      - name: Prepare testing environment
        run: yarn test:setup
        env:
          npm_config_arch: x64
      - name: Run unit tests
        run: yarn test:unit
      - name: Run script tests
        run: yarn test:script
